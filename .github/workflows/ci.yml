name: Hello CI 
on: push
jobs:
 say-hello:
  runs-on: ubuntu-latest
  steps: 
   - name: print greeting
     run: echo "Hello, CI!"
   - name: print current time
     run: date
   - name: print Sri Lankan time zone
     run: TZ="Asia/Colombo" date
   - name: Github Username
     run: echo "Pushed by ${{ github.actor }}"
     run: exit 1

 say-goodbye:
  runs-on: ubuntu-latest
  needs: say-hello
  steps:
   - name: Print farewell
     run: echo "Bye. CI!"
   - name: Print GoodBye message
     run: echo "GoodBye ${{ github.actor }}"
